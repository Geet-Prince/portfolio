<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF3B3B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FDFBF7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sleek rounded background -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  <!-- Subtle border for depth -->
  <rect width="98" height="98" x="1" y="1" rx="23" fill="none" stroke="#EBE8E0" stroke-width="1.5" />
  
  <!-- Minimalist P/R Monogram -->
  <!-- The Loop of P & R -->
  <path d="M34 28 L48 28 C58 28 64 34 64 42 C64 50 58 56 48 56 L34 56 Z" fill="none" stroke="#2D2A26" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- The Stem -->
  <path d="M34 28 L34 72" stroke="#2D2A26" stroke-width="8.5" stroke-linecap="round" />
  
  <!-- The Leg of the R in accent color -->
  <path d="M48 56 L64 72" stroke="url(#accentGrad)" stroke-width="8.5" stroke-linecap="round" />
  
  <!-- Tech data node -->
  <circle cx="76" cy="72" r="5" fill="url(#accentGrad)" />
</svg>
